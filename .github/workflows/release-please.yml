name: Release Please

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    steps:
      # An App token rather than GITHUB_TOKEN, so CI runs on the release PR.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      # The GitHub Release this cuts is the HACS distribution channel; the
      # manifest.json version is bumped via extra-files (see
      # release-please-config.json).
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
