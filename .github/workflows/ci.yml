name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Renovate rebases push in quick succession; don't stack stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # The brands repository no longer accepts custom-integration icons
          # (HA 2026.3+ serves them from the integration's own brand/ dir).
          # Drop this once brand/icon.png ships here.
          ignore: brands

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx ruff check .
      - run: |
          uv venv --python 3.14
          uv pip install -r requirements_test.txt
          uv run basedpyright
          uv run pytest

  renovate-config:
    name: Validate renovate config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes --package renovate -- renovate-config-validator --strict
